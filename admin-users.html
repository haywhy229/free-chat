<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17052d"><title>Manage Users • FREE CHAT</title><link rel="stylesheet" href="style.css"><style>
.users-wrap{max-width:900px;margin:24px auto;padding:16px;color:#fff}.users-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.users-tools{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.users-tools input{flex:1;min-width:190px;background:#17052d;color:#fff;border:1px solid #68438a;border-radius:11px;padding:12px}.user-card{display:flex;justify-content:space-between;gap:14px;align-items:center;background:#210b3b;border:1px solid #563078;border-radius:15px;padding:15px;margin:11px 0}.user-card small{display:block;color:#c9b8d9;overflow-wrap:anywhere;margin-top:5px}.user-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.user-actions select{background:#17052d;color:#fff;border:1px solid #68438a;border-radius:9px;padding:9px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.danger{background:#b4233a;color:#fff}.warn{background:#d58b19;color:#190d24}.safe{background:#16865b;color:#fff}.status{min-height:25px;color:#e3d5f3}.badge{display:inline-block;border-radius:20px;padding:4px 9px;font-size:12px;margin-top:6px}.active{background:#145c42}.banned{background:#8b2438}@media(max-width:600px){.user-card{align-items:flex-start;flex-direction:column}.user-actions{width:100%}}
</style></head><body><main class="users-wrap"><header class="users-head"><div><h1>🛡️ FREE CHAT — Manage Users</h1><p>Administrator-only user management.</p></div><button class="btn" id="refreshUsers" type="button">↻ Refresh</button></header><div class="users-tools"><input id="searchUsers" type="search" placeholder="Search username or email…" aria-label="Search users"></div><p id="usersStatus" class="status" role="status" aria-live="polite">Checking administrator access…</p><section id="usersList"></section><p><a href="admin-support.html">← Admin Support</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const statusEl=document.getElementById('usersStatus'),list=document.getElementById('usersList'),search=document.getElementById('searchUsers');let allUsers=[];
async function call(action,userId=null,duration=null){const {data:{session},error}=await supabaseClient.auth.getSession();if(error||!session)throw new Error('Please sign in as an administrator.');const response=await fetch(`${SUPABASE_URL}/functions/v1/admin-service`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action,userId,duration})});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||`Admin service returned HTTP ${response.status}. Check that the admin-service Edge Function has been updated and deployed.`);return data;}
function renderUsers(){list.replaceChildren();const q=search.value.trim().toLowerCase();const users=allUsers.filter(u=>(u.username+' '+u.email).toLowerCase().includes(q));if(!users.length){list.textContent='No matching users.';return;}for(const u of users){const card=document.createElement('article');card.className='user-card';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=u.username;const detail=document.createElement('small');detail.textContent=`${u.email||'No email'} · Joined ${new Date(u.created_at).toLocaleDateString()}`;const badge=document.createElement('span');badge.className='badge '+(u.is_banned?'banned':'active');badge.textContent=u.is_banned?`BANNED${u.ban_type==='permanent'?' · PERMANENT':''}`:'ACTIVE';info.append(name,detail,badge);if(u.is_banned&&u.banned_until){const until=document.createElement('small');until.textContent=u.ban_type==='permanent'?'Ban set to permanent (10-year Auth ban; manually unban to restore access).':`Ban expires: ${new Date(u.banned_until).toLocaleString()}`;info.append(until);}const actions=document.createElement('div');actions.className='user-actions';if(u.is_banned){const unban=document.createElement('button');unban.className='btn safe';unban.textContent='Unban';unban.onclick=()=>runAction(unban,async()=>{if(!confirm(`Unban ${u.username}?`))return false;await call('unban_user',u.id);});actions.append(unban);}else{const duration=document.createElement('select');[['1_day','1 day'],['7_days','7 days'],['30_days','30 days'],['permanent','Permanent']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;duration.append(o)});const ban=document.createElement('button');ban.className='btn warn';ban.textContent='Ban user';ban.onclick=()=>runAction(ban,async()=>{if(!confirm(`Ban ${u.username} for ${duration.options[duration.selectedIndex].text}?`))return false;await call('ban_user',u.id,duration.value);});actions.append(duration,ban);}const del=document.createElement('button');del.className='btn danger';del.textContent='Delete';del.onclick=()=>runAction(del,async()=>{if(!confirm(`Permanently delete ${u.username}'s account? This cannot be undone.`))return false;await call('delete_user',u.id);});actions.append(del);card.append(info,actions);list.append(card);}}
async function runAction(button,fn){button.disabled=true;const old=button.textContent;button.textContent='Working…';try{const proceed=await fn();if(proceed===false){button.disabled=false;button.textContent=old;return;}statusEl.textContent='Action completed.';await loadUsers();}catch(e){statusEl.textContent=e.message;button.disabled=false;button.textContent=old;}}
async function loadUsers(){list.replaceChildren();statusEl.textContent='Loading users…';try{const d=await call('list_users');allUsers=d.users||[];statusEl.textContent=`Loaded ${allUsers.length} users (first 200).`;renderUsers();}catch(e){statusEl.textContent=e.message;}}
document.getElementById('refreshUsers').addEventListener('click',loadUsers);search.addEventListener('input',renderUsers);loadUsers();
</script></body></html>
